# ntfy — serveur de notifications push auto-hébergé
# Toutes les données restent sur la machine Specula, aucun appel externe.
listen-http: :80
cache-file: /var/cache/ntfy/cache.db
cache-duration: 12h
visitor-request-limit-burst: 60
visitor-request-limit-replenish: 10s
# Pas d'auth sur ntfy : le topic UUID est le seul facteur d'accès.
# Pour une sécurité accrue, activer auth ici et passer les credentials dans le backend.
